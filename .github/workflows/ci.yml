name: CI
on:
  workflow_call:
    inputs:
      connector_repository:
        type: string
        default: ''
      connector_revision:
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_needed: ${{ steps.release.outputs.release_needed }}
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spencernorton/armiger
          ref: ${{ github.repository == 'spencernorton/armiger' && github.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind every job to this Armiger source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Test release failure cases
        run: python3 -m unittest discover -s ci/tests -v
      - name: Check versions, provenance and runnable quickstarts
        id: release
        env:
          CONSUMER: ${{ github.repository != 'spencernorton/armiger' }}
        run: |
          CONTRACT_ARGS=(--output out/release-contract.json)
          if [ "$CONSUMER" = true ]; then CONTRACT_ARGS+=(--consumer); fi
          python3 -m ci.release_contract "${CONTRACT_ARGS[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-contract
          path: out/release-contract.json
          retention-days: 14
  verify:
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spencernorton/armiger
          ref: ${{ needs.contract.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[ultra,dev]'
      - name: Download verified model data
        run: python -m armiger download --variant all
      - name: Test runtime and evaluation integrity
        env:
          ARMIGER_DHT_AUTO_UPDATE: 'false'
        run: python -m pytest -q
      - name: Build and verify installed wheel outside checkout
        env:
          ARMIGER_DHT_AUTO_UPDATE: 'false'
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/smoke_installed.py"
      - name: Validate supported Compose manifests
        run: |
          docker compose -f examples/bitmagnet/docker-compose.yml config --quiet
          docker compose -f examples/rats-search/docker-compose.yml config --quiet
          docker compose -f examples/standalone/docker-compose.yml config --quiet
  runtime:
    name: Real containers (${{ matrix.arch }})
    needs: contract
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spencernorton/armiger
          ref: ${{ needs.contract.outputs.source }}
          persist-credentials: false
      - name: Test the calling Connectors revision
        if: inputs.connector_revision != ''
        env:
          CONNECTOR_REPOSITORY: ${{ inputs.connector_repository }}
          CONNECTOR_REVISION: ${{ inputs.connector_revision }}
        run: python3 -m ci.pin_connectors --repository "$CONNECTOR_REPOSITORY" --revision "$CONNECTOR_REVISION"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the native Armiger candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: examples/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          provenance: false
          tags: armiger-ci:${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/spencernorton/armiger
            org.opencontainers.image.revision=${{ needs.contract.outputs.source }}
            org.opencontainers.image.version=${{ needs.contract.outputs.version }}
            io.armiger.tested-connector-revision=${{ inputs.connector_revision }}
          cache-from: type=gha,scope=armiger-${{ matrix.arch }}
          cache-to: type=gha,scope=armiger-${{ matrix.arch }},mode=max
      - name: Build the supported native Rats backend
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: examples/rats-search/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: rats-ci:amd64
          labels: |
            org.opencontainers.image.source=https://github.com/spencernorton/armiger
            org.opencontainers.image.revision=${{ needs.contract.outputs.source }}
            org.opencontainers.image.version=${{ needs.contract.outputs.version }}
          cache-from: type=gha,scope=rats-amd64
          cache-to: type=gha,scope=rats-amd64,mode=max
      - name: Start documented commands and prove upstream results
        env:
          CI_ARCH: ${{ matrix.arch }}
        run: |
          RUNTIME_ARGS=(--image "armiger-ci:$CI_ARCH" --evidence "out/$CI_ARCH")
          if [ "$CI_ARCH" = amd64 ]; then RUNTIME_ARGS+=(--rats-image rats-ci:amd64); fi
          python3 -m ci.runtime_acceptance "${RUNTIME_ARGS[@]}"
      - name: Push exactly these tested payloads as run-specific candidates
        if: github.repository == 'spencernorton/armiger' && github.ref == 'refs/heads/main' && needs.contract.outputs.release_needed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          CI_ARCH: ${{ matrix.arch }}
          SOFTWARE_VERSION: ${{ needs.contract.outputs.version }}
          SOURCE_REVISION: ${{ needs.contract.outputs.source }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          python3 -m ci.candidates --evidence "out/$CI_ARCH" --version "$SOFTWARE_VERSION" --source "$SOURCE_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runtime-evidence-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/
          retention-days: 14
          overwrite: true
  test:
    name: test
    if: always()
    needs: [contract, verify, runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require release contract, both Python checks and both native runtime checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(j["result"]=="success" for j in results.values()), results'
  publish:
    name: Promote tested images and verify published stacks
    if: github.repository == 'spencernorton/armiger' && github.ref == 'refs/heads/main' && needs.contract.outputs.release_needed == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, contract, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spencernorton/armiger
          ref: ${{ needs.contract.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runtime-evidence-*
          merge-multiple: true
          path: out/received
      - name: Verify candidate identities, promote their digests and read back OCI stacks
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          SOFTWARE_VERSION: ${{ needs.contract.outputs.version }}
          SOURCE_REVISION: ${{ needs.contract.outputs.source }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          python3 -m ci.promote --evidence out/received --version "$SOFTWARE_VERSION" --source "$SOURCE_REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: published-release-proof
          path: |
            out/received/published.json
            out/received/release-*.json
          retention-days: 30
