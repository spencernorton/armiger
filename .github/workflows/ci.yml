name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[ultra,dev]'
      - name: Download verified model data
        run: python -m armiger download --variant all
      - name: Test runtime and evaluation integrity
        run: python -m pytest -q
      - name: Build and verify installed wheel outside checkout
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/smoke_installed.py"
      - name: Validate supported Compose manifests
        run: |
          docker compose -f examples/bitmagnet/docker-compose.yml config --quiet
          docker compose -f examples/rats-search/docker-compose.yml config --quiet
          docker compose -f examples/standalone/docker-compose.yml config --quiet
  test:
    name: test
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require both supported Python checks
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
  publish:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    if: github.repository == 'spencernorton/armiger' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: armiger
            dockerfile: examples/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
          - image: armiger
            dockerfile: examples/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: armiger-rats-search
            dockerfile: examples/rats-search/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish native image without replacing an existing release
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ghcr.io/spencernorton/${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "$IMAGE:$VERSION is already released; leaving it unchanged."
            exit 0
          fi
          TAG="$IMAGE:sha-$GITHUB_SHA-$ARCH"
          if docker buildx imagetools inspect "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists; leaving it unchanged."
          else
            docker buildx create --use --driver docker-container
            docker buildx build --platform "linux/$ARCH" --file "$DOCKERFILE" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              --tag "$TAG" --push .
          fi
  publish-index:
    name: Publish release manifests
    if: github.repository == 'spencernorton/armiger' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish only after all native builds succeed
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          for IMAGE in armiger armiger-rats-search; do
            BASE="ghcr.io/spencernorton/$IMAGE:$VERSION"
            if docker buildx imagetools inspect "$BASE" > /dev/null 2>&1; then
              echo "$BASE already exists; leaving it unchanged."
            elif [ "$IMAGE" = armiger ]; then
              docker buildx imagetools create --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BASE" "ghcr.io/spencernorton/$IMAGE:sha-$GITHUB_SHA-amd64" "ghcr.io/spencernorton/$IMAGE:sha-$GITHUB_SHA-arm64"
            else
              docker buildx imagetools create --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" --tag "$BASE" "ghcr.io/spencernorton/$IMAGE:sha-$GITHUB_SHA-amd64"
            fi
          done
          for SETUP in bitmagnet rats-search; do
            STACK="ghcr.io/spencernorton/armiger-$SETUP-stack:$VERSION"
            if docker buildx imagetools inspect --raw "$STACK" > /dev/null 2>&1; then
              echo "$STACK already exists; leaving it unchanged."
              continue
            fi
            docker compose -f "examples/$SETUP/docker-compose.yml" config --format json > "$RUNNER_TEMP/$SETUP-raw.json"
            python3 - "$RUNNER_TEMP/$SETUP-raw.json" "$RUNNER_TEMP/$SETUP.json" <<'PYTHON'
          import json, sys
          from pathlib import Path
          model = json.loads(Path(sys.argv[1]).read_text())
          model.pop("name", None)
          for kind in ("volumes", "networks"):
              for resource in model.get(kind, {}).values():
                  resource.pop("name", None)
          Path(sys.argv[2]).write_text(json.dumps(model))
          PYTHON
            docker compose -f "$RUNNER_TEMP/$SETUP.json" publish --yes "$STACK"
          done
