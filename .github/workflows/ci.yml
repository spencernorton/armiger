name: CI
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[ultra,dev]'
      - name: Download verified model data
        run: python -m armiger download --variant all
      - name: Test runtime and evaluation integrity
        run: python -m pytest -q
      - name: Build and verify installed wheel outside checkout
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/smoke_installed.py"
      - name: Validate supported Compose manifests
        run: |
          docker compose --env-file examples/bitmagnet/.env.example -f examples/bitmagnet/docker-compose.yml config --quiet
          docker compose --env-file examples/rats-search/.env.example -f examples/rats-search/docker-compose.yml config --quiet
  test:
    name: test
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Require both supported Python checks
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
