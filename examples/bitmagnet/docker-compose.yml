services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U bitmagnet -d bitmagnet']
      interval: 5s
      timeout: 5s
      retries: 20
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:v0.10.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:${BITMAGNET_HTTP_PORT:-3333}:3333'
      - '${BITMAGNET_DHT_PORT:-3334}:3334/tcp'
      - '${BITMAGNET_DHT_PORT:-3334}:3334/udp'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_NAME: bitmagnet
      POSTGRES_USER: bitmagnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    command: [worker, run, --keys=http_server, --keys=queue_server, --keys=dht_crawler]
  armiger-ultra:
    build:
      context: ../..
      dockerfile: examples/Dockerfile
    image: armiger-ultra-local:3.1.0
    restart: unless-stopped
    depends_on:
      bitmagnet:
        condition: service_started
    ports:
      - '127.0.0.1:${ARMIGER_HTTP_PORT:-8096}:8096'
      - '127.0.0.1:${ARMIGER_PROXY_PORT:-8097}:8097'
    environment:
      ARMIGER_CONNECTOR_MODE: both
      ARMIGER_CONNECTOR_HOST: 0.0.0.0
      ARMIGER_CONNECTOR_PORT: '8096'
      ARMIGER_PROXY_PORT: '8097'
      BITMAGNET_GRAPHQL_URL: http://bitmagnet:3333/graphql
      UPSTREAM_TORZNAB_URL: http://bitmagnet:3333/torznab
      ARMIGER_PRUNE_MALWARE: ${ARMIGER_PRUNE_MALWARE:-false}
      ARMIGER_PRUNE_DEAD_SWARMS: 'false'
      ARMIGER_REJECT_DEAD_SWARMS: 'false'
    volumes:
      - armiger_models:/models
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/healthz', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
volumes:
  postgres_data:
  armiger_models:
