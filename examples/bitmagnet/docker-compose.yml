services:
  bitmagnet:
    image: ghcr.io/bitmagnet-io/bitmagnet:latest
    container_name: bitmagnet
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3333:3333"
      - "3334:3334/tcp"
      - "3334:3334/udp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_NAME: bitmagnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler

  armiger-bitmagnet-bridge:
    image: python:3.12-slim
    container_name: armiger-bitmagnet-bridge
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - bitmagnet
    ports:
      - "8096:8096"
    environment:
      ARMIGER_MODEL_DIR: /app
      ARMIGER_VARIANT: "${ARMIGER_VARIANT:-int8}"
      ARMIGER_BRIDGE_HOST: "0.0.0.0"
      ARMIGER_BRIDGE_PORT: "8096"
      BITMAGNET_GRAPHQL_URL: "http://bitmagnet:3333/graphql"
      ARMIGER_PRUNE_MALWARE: "true"
      ARMIGER_PRUNE_DEAD_SWARMS: "false"
    volumes:
      - ../..:/app:ro
    command:
      - sh
      - -c
      - "pip install --no-cache-dir numpy onnxruntime cryptography && python3 examples/bitmagnet/bitmagnet_armiger_bridge.py"

  armiger-torznab-proxy:
    image: python:3.12-slim
    container_name: armiger-torznab-proxy
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - bitmagnet
    ports:
      - "8097:8097"
    environment:
      ARMIGER_MODEL_DIR: /app
      ARMIGER_VARIANT: "${ARMIGER_VARIANT:-int8}"
      UPSTREAM_TORZNAB_URL: "http://bitmagnet:3333/torznab"
      ARMIGER_PROXY_PORT: "8097"
      ARMIGER_REQUIRE_ENGLISH_AUDIO: "false"
      ARMIGER_ALLOW_ENGLISH_SUBS: "true"
      ARMIGER_REJECT_DEAD_SWARMS: "true"
    volumes:
      - ../..:/app:ro
    command:
      - sh
      - -c
      - "pip install --no-cache-dir numpy onnxruntime cryptography && python3 examples/arr-stack/armiger_torznab_proxy.py"

  postgres:
    image: postgres:16-alpine
    container_name: bitmagnet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bitmagnet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - bitmagnet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d bitmagnet -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bitmagnet_pgdata:
