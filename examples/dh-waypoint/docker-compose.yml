services:
  dh-waypoint:
    image: ghcr.io/spencernorton/dh-waypoint:v5.6.0
    container_name: dh-waypoint
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      armiger-ultra:
        condition: service_healthy
    ports:
      - "3333:3333"
      - "3334:3334/tcp"
      - "3334:3334/udp"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: dh_waypoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      DH_WAYPOINT_PROCESSORS_PLUGIN_DIR: /etc/dh-waypoint/plugins.d
    volumes:
      - ./07-armiger-ultra.plugin.yml:/etc/dh-waypoint/plugins.d/07-armiger-ultra.plugin.yml:ro
    command:
      - worker
      - run
      - --keys=http_server
      - --keys=queue_server
      - --keys=dht_crawler

  armiger-ultra:
    image: python:3.12-slim
    container_name: armiger-ultra
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8095:8095"
    environment:
      ARMIGER_MODEL_DIR: /app
      ARMIGER_VARIANT: "${ARMIGER_VARIANT:-fp32}"
      ARMIGER_PORT: "8095"
      ARMIGER_ADULT_THRESHOLD: "0.35"
      ARMIGER_JUNK_THRESHOLD: "0.25"
      ARMIGER_SCOPE_THRESHOLD: "0.35"
      ARMIGER_USE_ZERO_CUE_CATALOG: "true"
      ARMIGER_DHT_RSI_MODE: "${ARMIGER_DHT_RSI_MODE:-pull_only}"
    volumes:
      - ../..:/app:ro
      - armiger_state:/var/lib/armiger
    command:
      - sh
      - -c
      - "pip install --no-cache-dir numpy onnxruntime cryptography && python3 examples/dh-waypoint/armiger_waypoint_processor.py"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8095/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: dh-waypoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dh_waypoint
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
    volumes:
      - dh_waypoint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d dh_waypoint -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  armiger_state:
  dh_waypoint_pgdata:
