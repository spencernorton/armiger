services:
  armiger-ultra:
    image: ghcr.io/spencernorton/armiger:3.13.1
    restart: unless-stopped
    environment:
      # Required: choose the model update channel (dht, hf, or off).
      ARMIGER_UPDATE_CHANNEL: ${ARMIGER_UPDATE_CHANNEL:?Set ARMIGER_UPDATE_CHANNEL to dht, hf, or off}
    ports:
      - '127.0.0.1:8096:8096'
