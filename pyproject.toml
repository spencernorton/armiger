[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armiger"
version = "2.1.0"
description = "Armiger & Armiger Ultra: 6.1M-parameter multi-head neural torrent metadata classifier, Mondrian safety gates, and 6-plugin SDK"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Spencer Norton", email = "279589816+gekleos@users.noreply.github.com"}
]
keywords = ["onnx", "pytorch", "classification", "metadata", "bittorrent", "dht", "conformal-prediction", "safety"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "numpy>=1.24.0",
  "onnxruntime>=1.16.0",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
torch = ["torch>=2.1.0"]
dev = ["pytest>=7.4.0", "torch>=2.1.0"]

[project.urls]
Homepage = "https://github.com/spencernorton/armiger"
Repository = "https://github.com/spencernorton/armiger"
Issues = "https://github.com/spencernorton/armiger/issues"
Security = "https://github.com/spencernorton/armiger/blob/main/SECURITY.md"
Legal = "https://github.com/spencernorton/armiger/blob/main/LEGAL.md"

[tool.setuptools]
py-modules = [
  "armiger_inference",
  "armiger_ultra_pipeline",
  "swarm_priors",
  "swarm_survival",
  "zero_cue_plugin",
  "audio_language_guard",
  "calibration_and_dht",
  "armiger_dht_rsi",
  "armiger_dht_db_sync",
  "csam_guard",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
