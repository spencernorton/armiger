[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "armiger"
version = "3.4.0"
description = "Local ONNX classification of torrent and media metadata with optional enrichment"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
  {name = "Spencer Norton", email = "12041021+NorviTechGH@users.noreply.github.com"}
]
keywords = ["onnx", "pytorch", "classification", "metadata", "bittorrent", "dht", "conformal-prediction", "safety"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "numpy>=1.24.0",
  "onnxruntime>=1.16.0",
  "cryptography>=41.0.0",
]

[project.optional-dependencies]
ultra = ["torch>=2.1.0"]
torch = ["torch>=2.1.0"]
dev = ["pytest>=7.4.0", "build>=1.0", "onnx>=1.16.0"]
charts = ["matplotlib>=3.8", "pillow>=10"]

[project.urls]
Homepage = "https://norvitech.com/ai-models/#armiger"
Repository = "https://github.com/spencernorton/armiger"
Issues = "https://github.com/spencernorton/armiger/issues"
Security = "https://github.com/spencernorton/armiger/blob/main/.github/SECURITY.md"
Legal = "https://github.com/spencernorton/armiger/blob/main/.github/LEGAL.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["armiger"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["armiger_dht_db_sync", "armiger_dht_rsi", "armiger_inference", "armiger_ultra", "armiger_ultra_pipeline", "audio_language_guard", "calibration_and_dht", "csam_guard", "swarm_priors", "swarm_survival", "zero_cue_plugin"]

[tool.setuptools.package-data]
armiger = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/test_chart_integrity.py"]
pythonpath = ["benchmarks", "tests"]
python_files = ["test_*.py"]
